name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Laravel ${{ matrix.laravel }} / Nova ${{ matrix.nova }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '11.*'
            testbench: '^9.0'
            nova: '^4.0'
          - laravel: '11.*'
            testbench: '^9.0'
            nova: '^5.0'
          - laravel: '12.*'
            testbench: '^10.0'
            nova: '^5.0'
          - laravel: '13.*'
            testbench: '^11.0'
            nova: '^5.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Nova Composer credentials
        run: composer config http-basic.nova.laravel.com "${{ secrets.NOVA_USERNAME }}" "${{ secrets.NOVA_LICENSE_KEY }}"

      - name: Select dependency versions
        run: |
          composer require "illuminate/contracts:${{ matrix.laravel }}" "illuminate/filesystem:${{ matrix.laravel }}" "illuminate/http:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "laravel/nova:${{ matrix.nova }}" --no-update

      - name: Install PHP dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build

      - name: Run package tests
        run: composer test

      - name: Run Pint
        run: composer lint
